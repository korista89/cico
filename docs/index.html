<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>경은 SW-PBS 운영실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 운영실 상황판 — 좌측 레일(다층 삼각형 내비) + 카드형 작업면, 휴대폰에서는 하단 탭 + 기록 버튼 */
:root{
  --bg:#eef2ef; --surface:#ffffff; --surface-2:#f6f8f6; --sunk:#e6ebe7;
  --ink:#132019; --ink-2:#46544d; --muted:#7c8983; --line:#d9e0db; --line-2:#c6cfc9;
  --accent:#1d4f91; --accent-ink:#ffffff; --accent-soft:#e3ecf8;
  --t1:#2e8655; --t1-soft:#e2f2e8; --t2:#c98a00; --t2-soft:#fbf1d6; --t3:#c9423a; --t3-soft:#f9e3e1;
  --good:#1f8a3c; --warn:#b97800; --bad:#c43d3d; --info:#2a78d6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --grid:#e4e9e5; --axis:#c3cbc6;
  --shadow:0 1px 2px rgba(19,32,25,.06),0 4px 14px rgba(19,32,25,.06);
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-display:"Hahmlet","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px; --r-s:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#161e1a; --surface-2:#1b2520; --sunk:#111915;
  --ink:#e6eee9; --ink-2:#b0bdb6; --muted:#7f8c86; --line:#28332e; --line-2:#36423c;
  --accent:#7ea7e6; --accent-ink:#0e1411; --accent-soft:#1d2b40;
  --t1:#4fb57c; --t1-soft:#17301f; --t2:#e2a92b; --t2-soft:#33290e; --t3:#e46a5f; --t3-soft:#3a1c1a;
  --good:#3fbf62; --warn:#e2a92b; --bad:#e66767; --info:#3987e5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2f9e2f; --s7:#9085e9; --s8:#e66767;
  --grid:#232d28; --axis:#3a4640;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#161e1a; --surface-2:#1b2520; --sunk:#111915;
  --ink:#e6eee9; --ink-2:#b0bdb6; --muted:#7f8c86; --line:#28332e; --line-2:#36423c;
  --accent:#7ea7e6; --accent-ink:#0e1411; --accent-soft:#1d2b40;
  --t1:#4fb57c; --t1-soft:#17301f; --t2:#e2a92b; --t2-soft:#33290e; --t3:#e46a5f; --t3-soft:#3a1c1a;
  --good:#3fbf62; --warn:#e2a92b; --bad:#e66767; --info:#3987e5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2f9e2f; --s7:#9085e9; --s8:#e66767;
  --grid:#232d28; --axis:#3a4640;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
.num,.tab{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.small{font-size:13px} .xs{font-size:12px}
.hidden{display:none!important}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px 24px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px 6px}
.brand-mark{width:38px;height:34px;flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand-sub{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;letter-spacing:.08em;color:var(--muted);padding:10px 10px 4px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-s);color:var(--ink-2);text-decoration:none;font-size:14.5px;position:relative}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav a .dot{width:9px;height:9px;border-radius:3px;flex:none;background:var(--line-2)}
.nav a .badge{margin-left:auto}
.dot.t1{background:var(--t1)} .dot.t2{background:var(--t2)} .dot.t3{background:var(--t3)} .dot.ac{background:var(--accent)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;min-height:58px}
.topbar h1{font-family:var(--f-display);font-size:19px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;flex:none}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.sync.pending i{background:var(--warn)} .sync.err i{background:var(--bad)}
.content{padding-block:20px 120px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1280px;width:100%}
.demo-bar{background:var(--t2-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--t2) 40%,transparent);border-radius:var(--r);padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.tabbar{display:none}
.fab{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:45;height:56px;padding:0 22px 0 18px;border-radius:28px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(29,79,145,.35)}
.fab svg{width:22px;height:22px}

/* ---------- building blocks ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.span2{grid-column:span 2}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flat{box-shadow:none}
.card.pad-l{padding:20px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{font-size:15.5px;font-weight:700}
.card-h .sub{font-size:12.5px;color:var(--muted)}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-display);font-size:22px;font-weight:700}
.sec-h p{color:var(--ink-2);font-size:14px;margin-top:2px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink);min-height:40px;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.big{min-height:52px;font-size:15.5px;padding:10px 18px;border-radius:12px}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.t1{background:var(--t1-soft);color:var(--ink);border-color:color-mix(in srgb,var(--t1) 35%,transparent)}
.chip.t2{background:var(--t2-soft);color:var(--ink);border-color:color-mix(in srgb,var(--t2) 40%,transparent)}
.chip.t3{background:var(--t3-soft);color:var(--ink);border-color:color-mix(in srgb,var(--t3) 40%,transparent)}
.chip .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.t1 .d{background:var(--t1)} .chip.t2 .d{background:var(--t2)} .chip.t3 .d{background:var(--t3)}
.chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center}
.badge.soft{background:var(--sunk);color:var(--ink-2)}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .lab{font-size:13px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi .val small{font-size:15px;font-weight:600;color:var(--ink-2);margin-left:3px}
.kpi .delta{font-size:12.5px;font-weight:600}
.delta.up-good,.delta.down-good{color:var(--good)} .delta.up-bad,.delta.down-bad{color:var(--bad)} .delta.flat{color:var(--muted)}
.kpi .spark{height:34px;margin-top:2px}
.kpi.tier1{border-top:3px solid var(--t1)} .kpi.tier2{border-top:3px solid var(--t2)} .kpi.tier3{border-top:3px solid var(--t3)} .kpi.acc{border-top:3px solid var(--accent)}

.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.meter.t1>i{background:var(--t1)} .meter.t2>i{background:var(--t2)} .meter.t3>i{background:var(--t3)} .meter.good>i{background:var(--good)} .meter.warn>i{background:var(--warn)} .meter.bad>i{background:var(--bad)}

/* alerts / todo */
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
.alert .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:14px}
.alert.bad .ic{background:var(--t3-soft);color:var(--bad)} .alert.warn .ic{background:var(--t2-soft);color:var(--warn)} .alert.good .ic{background:var(--t1-soft);color:var(--good)} .alert.info .ic{background:var(--accent-soft);color:var(--accent)}
.alert b{font-weight:700}
.alert .why{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.todo{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px dashed var(--line)}
.todo:last-child{border-bottom:0}
.todo .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;background:var(--surface)}
.todo.done .box{background:var(--t1);border-color:var(--t1);color:#fff}
.todo.done .t{color:var(--muted);text-decoration:line-through}
.todo .t{flex:1;min-width:0}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;min-height:96px}
.qa button:hover{border-color:var(--accent);background:var(--surface-2)}
.qa .qi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.qa .qi svg{width:20px;height:20px}
.qa b{font-size:15px}
.qa span{font-size:12.5px;color:var(--muted)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th,.tbl td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:var(--surface-2);font-weight:700;color:var(--ink-2);font-size:12.5px;white-space:nowrap;position:sticky;top:0}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.click,.click{cursor:pointer}
.li.click:hover{background:var(--surface-2)}
.tbl tr.click:hover td{background:var(--surface-2)}

/* forms */
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.flabel{font-size:13px;font-weight:700;color:var(--ink-2);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.flabel .hint{font-weight:400;color:var(--muted);font-size:12px}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:9px 11px;min-height:42px;font-size:15px}
textarea.inp{min-height:84px;resize:vertical;line-height:1.5}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.choices{display:flex;flex-wrap:wrap;gap:7px}
.choice{border:1.5px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;min-height:38px;color:var(--ink);line-height:1.2}
.choice:hover{border-color:var(--accent)}
.choice.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.choice.lv1.on{background:var(--t1);border-color:var(--t1);color:#fff}
.choice.lv2.on{background:var(--t2);border-color:var(--t2);color:#1b1400}
.choice.lv3.on{background:var(--t3);border-color:var(--t3);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 13px;font-size:13.5px;min-height:36px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--ink);font-weight:700}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;padding:6px 0}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* DPR grid */
.dpr{display:grid;grid-template-columns:minmax(92px,1.1fr) repeat(3,minmax(0,1fr));gap:6px;align-items:stretch}
.dpr .h{font-size:12.5px;font-weight:700;color:var(--ink-2);text-align:center;padding:6px 2px}
.dpr .p{display:flex;flex-direction:column;justify-content:center;padding:6px 8px;background:var(--surface-2);border-radius:8px;font-size:13px;min-width:0}
.dpr .p b{font-size:14px}
.dpr .p input{border:0;background:transparent;font-size:12px;color:var(--muted);padding:0;width:100%}
.dpr .p.abs{opacity:.5}
.sc{display:flex;gap:4px}
.sc button{flex:1;min-height:44px;border-radius:8px;border:1.5px solid var(--line-2);background:var(--surface);font-weight:800;font-size:16px;color:var(--ink-2)}
.sc button.on.v0{background:var(--t3-soft);border-color:var(--t3);color:var(--ink)}
.sc button.on.v1{background:var(--t2-soft);border-color:var(--t2);color:var(--ink)}
.sc button.on.v2{background:var(--t1);border-color:var(--t1);color:#fff}
.dpr-total{display:flex;align-items:center;gap:16px;padding:14px;border-radius:12px;background:var(--surface-2);flex-wrap:wrap}
.dpr-total .big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}

/* 4:1 counter */
.tally{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tally button{min-height:130px;border-radius:16px;border:0;font-size:18px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tally .pr{background:var(--t1);color:#fff}
.tally .co{background:var(--sunk);color:var(--ink)}
.tally .n{font-size:44px;line-height:1}
.ratio-big{font-size:42px;font-weight:800;letter-spacing:-.02em}

/* matrix */
.mx{display:grid;grid-template-columns:150px repeat(3,minmax(0,1fr)) minmax(0,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px}
.mx>div{background:var(--surface);padding:10px 12px}
.mx .mh{background:var(--surface-2);font-weight:700;font-size:13px}
.mx .mh.e1{box-shadow:inset 0 3px 0 var(--t1)} .mx .mh.e2{box-shadow:inset 0 3px 0 var(--s1)} .mx .mh.e3{box-shadow:inset 0 3px 0 var(--s7)}
.mx .sp{font-weight:700}
.mx ul{margin:0;padding-left:16px} .mx li{margin:2px 0}

/* charts */
.chart{width:100%;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .lbl{fill:var(--ink-2);font-size:11.5px}
.chart .val{fill:var(--ink);font-size:11.5px;font-weight:700}
.chart .grid line{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--axis);stroke-width:1}
.chart .goal{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:5 4}
.chart .goal-t{fill:var(--ink-2);font-size:11px;font-weight:700}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .hit:hover+.hl,.chart .bar:hover{opacity:.85}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend i.sq{height:10px;width:10px;border-radius:3px}

const $ = (s, el = document) => el.querySelector(s);

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const TODAY = () => iso(new Date());
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return iso(d); };
const addMonths = (mk, n) => { const d = parseD(mk + '-01'); d.setMonth(d.getMonth() + n); return iso(d).slice(0, 7); };
const monthKey = s => String(s).slice(0, 7);
const weekStart = s => { const d = parseD(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
const dow = s => parseD(s).getDay();
const DOW = '일월화수목금토';
const fmtD = s => { if (!s) return ''; const d = parseD(s); return `${d.getMonth() + 1}.${d.getDate()}(${DOW[d.getDay()]})`; };
const fmtDs = s => { if (!s) return ''; const d = parseD(s); return `${d.getMonth() + 1}/${d.getDate()}`; };

const nowTime = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const sum = a => a.reduce((x, y) => x + (+y || 0), 0);
const avg = a => { const v = a.filter(x => x != null && !isNaN(x)); return v.length ? sum(v) / v.length : null; };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const r1 = x => x == null ? null : Math.round(x * 10) / 10;
const won = n => Math.round(n || 0).toLocaleString('ko-KR');
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const countBy = (arr, f) => { const m = {}; arr.forEach(x => { [].concat(f(x)).forEach(k => { if (k != null && k !== '') m[k] = (m[k] || 0) + 1; }); }); return m; };
const sortedEntries = m => Object.entries(m).sort((a, b) => b[1] - a[1]);
const groupBy = (arr, f) => { const m = {}; arr.forEach(x => { const k = f(x); (m[k] = m[k] || []).push(x); }); return m; };
const LS = {

const COLS = ['settings', 'staff', 'students', 'bir', 'dpr', 't3log', 't3plan', 'consult', 'praise', 'obs', 'teach', 'market', 'meeting', 'tasks', 'fidelity', 'etlp', 'coaching', 'requests', 'kudos', 'budget', 'weekly'];

const DEMO_KEY = 'pbs-demo-v1', QUEUE_KEY = 'pbs-queue-v1', ME_KEY = 'pbs-me-v1', CODE_KEY = 'pbs-code-v1';

const DEFAULT_SET = {
  id: 'main', school: '경은학교', year: 2026, totalStudents: 190, totalStaff: 70,

function gasCall(fn, ...args) {
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args);
  });
}

const Store = {
  mode: 'demo', state: 'ok', queue: [], code: '', sheetUrl: '', lastSync: null, busy: false,
  isGas() { return typeof google !== 'undefined' && google.script && google.script.run; },
  async init() {
    if (this.isGas()) {
      this.mode = 'gas';
      this.code = LS.get(CODE_KEY, '');
      this.queue = LS.get(QUEUE_KEY, []);
      await this.pull(true);
    } else {
      this.mode = 'demo';
      const saved = LS.get(DEMO_KEY, null);
      if (saved && saved.v === 1) COLS.forEach(c => { DB[c] = saved.db[c] || []; });
      else { buildSample(); this.persistDemo(); }
    }
  },
  async pull(first) {
    if (this.mode !== 'gas') return;
    try {
      const res = await gasCall('apiLoadAll', this.code);
      COLS.forEach(c => { DB[c] = (res.data && res.data[c]) || []; });
      this.sheetUrl = res.sheetUrl || '';
      // 아직 전송되지 않은 내 변경분을 다시 덮어씀
      this.queue.forEach(op => this.applyLocal(op));
      this.lastSync = new Date(); this.state = this.queue.length ? 'pending' : 'ok';
      if (first && !DB.settings.length) await this.seedFresh();
      this.flush();
    } catch (e) {
      const msg = String(e && e.message || e);
      if (msg.includes('ACCESS_DENIED')) { this.state = 'locked'; throw new Error('ACCESS_DENIED'); }
      this.state = 'err'; if (first) throw e;
    }
  },
  async seedFresh() {
    const set = Object.assign({}, DEFAULT_SET, { updatedAt: new Date().toISOString() });
    this.save('settings', set);
    this.saveMany('tasks', roadmapTasks());
  },
  applyLocal(op) {
    const arr = DB[op.col];
    if (op.t === 'del') { const i = arr.findIndex(r => r.id === op.id); if (i >= 0) arr.splice(i, 1); return; }
    (op.recs || [op.rec]).forEach(rec => {
      const i = arr.findIndex(r => r.id === rec.id);
      if (i >= 0) arr[i] = rec; else arr.push(rec);
    });
  },
  stamp(rec) {
    rec.id = rec.id || uid();
    rec.updatedAt = new Date().toISOString();
    if (!rec.by && ME.get()) rec.by = ME.get().name;
    return rec;
  },
  save(col, rec) {
    this.stamp(rec);
    const op = { t: 'save', col, rec };
    this.applyLocal(op); this.commit(op);
    return rec;
  },
  saveMany(col, recs) {
    recs.forEach(r => this.stamp(r));
    const op = { t: 'many', col, recs };
    this.applyLocal(op); this.commit(op);
  },
  remove(col, id) {
    const op = { t: 'del', col, id };
    this.applyLocal(op); this.commit(op);
  },
  commit(op) {
    if (this.mode === 'demo') { this.persistDemo(); return; }
    this.queue.push(op); LS.set(QUEUE_KEY, this.queue);
    this.state = 'pending'; paintSync(); this.flush();
  },
  persistDemo() { LS.set(DEMO_KEY, { v: 1, db: DB }); },
  async flush() {
    if (this.mode !== 'gas' || this.busy || !this.queue.length) return;
    this.busy = true;
    while (this.queue.length) {
      const op = this.queue[0];
      try {
        if (op.t === 'del') await gasCall('apiRemove', this.code, op.col, op.id);
        else {
          const recs = op.recs || [op.rec];
          await gasCall('apiSaveMany', this.code, op.col, recs, recs.map(r => sheetView(op.col, r)));
        }
        this.queue.shift(); LS.set(QUEUE_KEY, this.queue);
      } catch (e) {
        this.state = 'err'; paintSync(); this.busy = false;
        setTimeout(() => this.flush(), 15000);
        return;
      }
    }
    this.busy = false; this.state = 'ok'; this.lastSync = new Date(); paintSync();
  },
  resetDemo() { LS.del(DEMO_KEY); COLS.forEach(c => { DB[c] = []; }); buildSample(); this.persistDemo(); },
  clearDemo() { COLS.forEach(c => { DB[c] = []; }); DB.settings.push(Object.assign({}, DEFAULT_SET)); DB.tasks = roadmapTasks(); this.persistDemo(); }
};

function roadmapTasks() {
  const out = [];
  PLAN.roadmap.forEach((p, pi) => p.tasks.forEach((t, ti) => out.push({ id: `task-${pi}-${ti}`, phase: pi, title: t, due: p.e, start: p.s, owner: p.who, done: false })));
  return out;
}

function sheetView(col, r) {

  if (!entries.length) return `<div class="empty">${opts.empty || '기록이 없습니다'}</div>`;
  const max = Math.max(...entries.map(e => e[1]), 1), tot = opts.total || sum(entries.map(e => e[1]));
  return entries.slice(0, opts.limit || 8).map(([k, v], i) => `<div class="hbar ${i === 0 && opts.hiTop !== false ? 'top' : ''}" data-tip="${esc(`<b>${esc(opts.label ? opts.label(k) : k)}</b><br>${v}건 · ${pct(v, tot)}%`)}"><span class="l">${esc(opts.label ? opts.label(k) : k)}</span><span class="b"><i style="width:${v / max * 100}%;${opts.color ? 'background:' + opts.color : ''}"></i></span><span class="v">${opts.showPct ? pct(v, tot) + '%' : v}</span></div>`).join('');
}
function heatmap(rows, cols, val, opts = {}) {
  const max = Math.max(1, ...rows.flatMap(r => cols.map(c => val(r, c))));
  let o = `<div class="heat" style="grid-template-columns:minmax(80px,1.4fr) repeat(${cols.length},minmax(30px,1fr))"><div></div>${cols.map(c => `<div class="hh" style="justify-content:center;text-align:center">${esc(opts.colLabel ? opts.colLabel(c) : c)}</div>`).join('')}`;
  rows.forEach(r => {
    o += `<div class="hh">${esc(opts.rowLabel ? opts.rowLabel(r) : r)}</div>`;
    cols.forEach(c => { const v = val(r, c); const a = v / max; o += `<div class="hc" style="background:color-mix(in srgb,var(--s2) ${Math.round(a * 85)}%,var(--surface-2));color:${a > .55 ? '#fff' : 'var(--ink-2)'}" data-tip="${esc(`<b>${esc(opts.rowLabel ? opts.rowLabel(r) : r)} · ${esc(opts.colLabel ? opts.colLabel(c) : c)}</b><br>${v}건`)}">${v || ''}</div>`; });
  });
  return o + '</div>';
}
function legend(items) { return `<div class="legend">${items.map(([n, c, sq]) => `<span><i class="${sq ? 'sq' : ''}" style="background:${c}"></i>${esc(n)}</span>`).join('')}</div>`; }
function deltaHtml(cur, prev, lowerBetter, unit = '%') {
  if (prev == null || cur == null || prev === 0) return '<span class="delta flat">비교 기준 없음</span>';
  const d = Math.round((cur - prev) / prev * 100);
  if (d === 0) return '<span class="delta flat">변화 없음</span>';
  const up = d > 0; const cls = up ? (lowerBetter ? 'up-bad' : 'up-good') : (lowerBetter ? 'down-good' : 'down-bad');
  return `<span class="delta ${cls}">${up ? '▲' : '▼'} ${Math.abs(d)}${unit} <span class="muted" style="font-weight:400">전월 대비</span></span>`;
}

/* ---------------- tooltip ---------------- */
function initTip() {
  const tip = document.createElement('div'); tip.id = 'tip'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip);
  const show = (e) => {
    const t = e.target.closest && e.target.closest('[data-tip]'); if (!t) { tip.classList.remove('on'); return; }
    tip.innerHTML = t.getAttribute('data-tip'); tip.classList.add('on');
    const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY - h - 12;
    if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y < 8) y = e.clientY + 18;
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = y + 'px';
    const band = t.closest('.band'); $$('.band .hl').forEach(l => l.setAttribute('opacity', '0')); if (band) band.querySelector('.hl').setAttribute('opacity', '.5');
  };
  document.addEventListener('pointermove', show);
  document.addEventListener('pointerdown', show);
  document.addEventListener('scroll', () => tip.classList.remove('on'), true);
  document.addEventListener('pointerleave', () => tip.classList.remove('on'));
}

/* ---------------- 의사결정 규칙 (DBDM decision rules) ---------------- */
function computeAlerts() {
  const out = []; const today = TODAY(); const mk = monthKey(today);
  const d30 = addDays(today, -30);
  // 1) CICO 선별 후보: 최근 30일 BIR(2단계↑) 2회 이상 또는 최근 7일 경미 5회 이상인 Tier 1 학생
  const recent = birIn(d30, today, 2);
  const cnt = countBy(recent, b => b.studentId);
  const minor7 = countBy(birIn(addDays(today, -7), today, 1, b => +b.level === 1), b => b.studentId);
  const cands = DB.students.filter(s => +s.tier === 1 && ((cnt[s.id] || 0) >= 2 || (minor7[s.id] || 0) >= 5));
  if (cands.length) out.push({ lv: 'warn', t: `CICO 선별 후보 ${cands.length}명`, why: cands.slice(0, 4).map(s => `${s.name}(${cnt[s.id] ? 'BIR ' + cnt[s.id] + '회' : '경미 ' + minor7[s.id] + '회'})`).join(', ') + ' — 30일 BIR 2회↑ 또는 주 5회↑ 경미행동', go: ['cico', 'screen'], act: '선별 검토' });
  // 2) CICO 학생별 판단
  cicoStudents().forEach(s => {
    const st = cicoStats(s.id); const dc = cicoDecision(st, s);
    if (dc.lv === 'bad') out.push({ lv: 'bad', t: `${s.name}: ${dc.t}`, why: dc.why + ' — 선행사건 수정·멘토링 강화', go: ['cico', 'stu:' + s.id], act: '학생 보기' });
    if (dc.t === '졸업·페이딩 검토') out.push({ lv: 'good', t: `${s.name}: 자기관리 전환 검토`, why: dc.why, go: ['cico', 'stu:' + s.id], act: '학생 보기' });
    // 3단계 위기 2회 이상 → Tier 3 의뢰 검토
    const c3 = birIn(d30, today, 3).filter(b => b.studentId === s.id).length;
    if (c3 >= 2) out.push({ lv: 'bad', t: `${s.name}: Tier 3 의뢰 검토`, why: `최근 30일 3단계 위기행동 ${c3}회`, go: ['tier3'], act: 'Tier 3' });
  });
  // 3) DPR 입력 누락
  if (isSchoolDay(today) && new Date().getHours() >= 15) {
    const miss = cicoStudents().filter(s => s.cicoStatus !== '자기관리' && !DB.dpr.some(d => d.studentId === s.id && d.date === today));
    if (miss.length) out.push({ lv: 'warn', t: `오늘 DPR 미입력 ${miss.length}명`, why: miss.map(s => s.name).join(', '), go: ['cico', 'dpr'], act: 'DPR 입력' });
  }
  // 4) Tier 3: 주 3회 이상 심리안정실, 부상
  t3Students().forEach(s => {
    const st = t3Stats(s.id); const lw = st.lastW;
    if (lw && lw.w >= weekStart(addDays(today, -7)) && lw.calm >= 3) out.push({ lv: 'bad', t: `${s.name}: 심리안정실 주 ${lw.calm}회`, why: '주 3회 이상 — Tier 3 전담팀 긴급 협의 및 BIP 수정', go: ['tier3', 'stu:' + s.id], act: 'BIP 보기' });
    const inj = st.rows.filter(r => r.injury && r.date >= addDays(today, -14));
    if (inj.length) out.push({ lv: 'bad', t: `${s.name}: 최근 2주 신체 부상 ${inj.length}건`, why: '목표 0건 — 안전 조치 점검·보호자 소통 확인', go: ['tier3', 'stu:' + s.id], act: '확인' });
    const cons = DB.consult.filter(c => c.studentId === s.id && c.type === '보호자 상담' && monthKey(c.date) === mk).length;
    if (+today.slice(8) >= 20 && cons < 2) out.push({ lv: 'warn', t: `${s.name}: 이번 달 보호자 상담 ${cons}/2회`, why: '계획: Tier 3 보호자 정기 상담 월 2회', go: ['tier3', 'stu:' + s.id], act: '상담 기록' });
  });
  // 5) 다발 장소 → 보완교수
  const [ms, me] = monthRange(mk); const mon = birIn(ms, me, 2);
  if (mon.length >= 5) {
    const top = big5(mon).loc[0];
    if (top && top[1] / mon.length >= .3) {
      const cls = top[0] === '보통교실';
      out.push(cls
        ? { lv: 'warn', t: `다발 장소: 보통교실 (${pct(top[1], mon.length)}%)`, why: '교실 수업 중 집중 — 학급 8대 실행(ETLPs) 자기점검·4:1 관찰과 GROW 코칭으로 대응', go: ['coach', 'etlp'], act: 'ETLP 점검' }
        : { lv: 'warn', t: `다발 장소: ${top[0]} (${pct(top[1], mon.length)}%)`, why: '이번 달 BIR 30% 이상 집중 — 넷째 주 월요일 보완교수(Booster)·Double Token Week', go: ['tier1', 'teach'], act: '보완교수 기록' });
    }
  }
  // 6) 로드맵 지연
  const late = DB.tasks.filter(t => !t.done && t.due < today);
  if (late.length) out.push({ lv: 'warn', t: `기한 지난 로드맵 과업 ${late.length}개`, why: late.slice(0, 2).map(t => t.title).join(' · '), go: ['roadmap'], act: '로드맵' });
  // 7) 회의 해결계획 미완료
  const openPlans = DB.meeting.filter(m => m.due && m.planStatus !== '완료' && m.due < today);
  if (openPlans.length) out.push({ lv: 'warn', t: `기한 지난 해결계획 ${openPlans.length}건`, why: openPlans.map(m => `${fmtM(monthKey(m.date))} 회의 · ${m.owner || '책임자 미정'}`).join(', '), go: ['meeting'], act: '점검' });
  // 8) 회의 D-day
  const md = meetingDate(mk); const dd = Math.round((parseD(md) - parseD(today)) / 864e5);

function onClick(e) {
  const t = e.target.closest('[data-go],[data-act],.choice,[data-seg] button,.sc button');
  if (!t) return;
  if (t.classList.contains('choice')) {
    const g = t.closest('[data-choice]'); if (!g) return;
    if (g.dataset.multi !== '1') $$('.choice', g).forEach(c => { if (c !== t) c.classList.remove('on'); });
    t.classList.toggle('on'); g.dispatchEvent(new CustomEvent('change', { bubbles: true })); return;
  }
  if (t.parentElement && t.parentElement.dataset.seg) {
    const g = t.parentElement; $$('button', g).forEach(c => c.classList.toggle('on', c === t));
    const name = g.dataset.seg; const v = t.dataset.v;
    if (SEG_HANDLERS[name]) { SEG_HANDLERS[name](v); } else g.dispatchEvent(new CustomEvent('change', { bubbles: true }));
    return;
  }
  if (t.parentElement && t.parentElement.classList.contains('sc')) { const g = t.parentElement; const was = t.classList.contains('on'); $$('button', g).forEach(c => c.classList.remove('on')); if (!was) t.classList.add('on'); g.dispatchEvent(new CustomEvent('change', { bubbles: true })); return; }
  if (t.dataset.go) {
    e.preventDefault(); const sub = t.dataset.sub; if (MODAL.open) closeModal(true);
    if (sub && sub.startsWith('stu:')) { if (t.dataset.go === 'cico') UI.cicoSel = sub.slice(4); if (t.dataset.go === 'tier3') UI.t3Sel = sub.slice(4); go(t.dataset.go, t.dataset.go === 'cico' ? 'stu' : null); return; }
    go(t.dataset.go, sub); return;
  }
  const a = t.dataset.act;
  if (a === 'modal-close') { closeModal(); return; }
  if (a === 'modal-save') { const b = $('#sheet-b'); const ok = MODAL.onSave ? MODAL.onSave(b) : true; if (ok !== false) { closeModal(true); rerender(); } return; }
  if (ACTIONS[a]) { e.preventDefault(); ACTIONS[a](t); }
}

  }

function debounce(f, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; }

   행동사건보고서(BIR) 입력 · Big 5 분석
   ================================================================ */
function openBir(rec) {
  const r = rec || { date: TODAY(), time: nowTime(), level: 2, types: [], ante: [], func: [], resp: [], post: [], reporterRole: ME.role() === '특수교육지도사' ? '지도사' : '담임' };
  const B = PLAN.bir;
  const body = `<div class="form">
    <div class="field"><label for="bir-q">학생 <span class="hint">이름 일부를 입력하면 목록이 좁혀집니다</span></label>
      <div class="f2"><input class="inp" id="bir-q" placeholder="이름·반 검색" autocomplete="off"><select class="inp" id="bir-stu">${stuOptions(r.studentId)}</select></div></div>
    <div class="f2"><div class="field"><label for="bir-date">발생 날짜</label><input class="inp" type="date" id="bir-date" value="${esc(r.date)}"></div>
      <div class="field"><label for="bir-time">시각</label><input class="inp" type="time" id="bir-time" value="${esc(r.time || '')}"></div></div>
    <div class="field"><span class="flabel">행동 강도 단계 <span class="hint">계획서 3단계 대응 기준</span></span>
      ${choices('level', B.levels.map(l => ({ v: l.v, l: `${l.name} (${l.en})`, c: 'lv' + l.v })), r.level)}
      <p class="xs muted" id="bir-lvdesc">${esc((B.levels.find(l => l.v == r.level) || B.levels[1]).desc)}</p></div>
    <div class="field"><span class="flabel">발생 장소 (Where)</span>${choices('loc', B.locations, r.location)}</div>
    <div class="field"><span class="flabel">활동·맥락 (When)</span>${choices('ctx', B.contexts, r.context)}</div>
    <div class="field" id="bir-types"><span class="flabel">주요 행동 유형 (What) <span class="hint">핵심 1~2개</span></span>${choices('types', +r.level === 1 ? B.typesMinor : B.types, r.types, { multi: true })}</div>
    <div class="field"><span class="flabel">직전 선행사건 (Antecedent)</span>${choices('ante', B.antecedents, r.ante, { multi: true })}</div>
    <div class="field"><span class="flabel">추정 행동 기능 (Why)</span>${choices('func', B.functions.map(f => ({ v: f.v, l: `${f.g}: ${f.v}` })), r.func, { multi: true })}</div>
    <div class="field"><span class="flabel">교육적·안전 조치</span>${choices('resp', B.responses, r.resp, { multi: true })}</div>
    <div class="field" id="bir-postf" ${+r.level === 1 ? 'hidden' : ''}><span class="flabel">심리안정실 및 사후 조치</span>${choices('post', B.post, r.post, { multi: true })}
      <div class="f2" style="margin-top:6px"><div class="field"><label for="bir-in">심리안정실 입실</label><input class="inp" type="time" id="bir-in" value="${esc(r.calmIn || '')}"></div><div class="field"><label for="bir-out">퇴실 <span class="hint">최대 20분 · 1:1 관찰</span></label><input class="inp" type="time" id="bir-out" value="${esc(r.calmOut || '')}"></div></div></div>
    <div class="field"><span class="flabel">보고자 구분</span>${choices('role', B.reporterRoles, r.reporterRole)}</div>
    <div class="field"><label for="bir-memo">메모 <span class="hint">관찰 사실만 짧게 (선택)</span></label><textarea class="inp" id="bir-memo" placeholder="예) 급식 대기 3분 경과 후 앞 친구 밀침. 시각 타이머 제시 후 진정.">${esc(r.memo || '')}</textarea></div>
  </div>`;
  openModal({
    title: rec ? '행동사건 기록 수정' : '행동사건 기록 (BIR)', body, wide: true,
    foot: `${rec ? `<button class="btn danger" data-act="bir-del" data-v="${esc(rec.id)}" style="margin-right:auto">삭제</button>` : ''}<button class="btn" data-act="modal-close">취소</button><button class="btn pri" data-act="modal-save">저장</button>`,
    onMount: b => {
      const q = $('#bir-q', b), sel = $('#bir-stu', b);
      q.addEventListener('input', () => { const k = q.value.trim(); $$('option', sel).forEach(o => { o.hidden = k && o.value && !o.textContent.includes(k); }); const first = $$('option', sel).find(o => o.value && !o.hidden); if (k && first) sel.value = first.value; });
      b.addEventListener('change', e => {
        if (e.target.dataset && e.target.dataset.choice === 'level') {
          const lv = +readChoice(b, 'level') || 2; const prev = readChoice(b, 'types') || [];
          $('#bir-types', b).innerHTML = `<span class="flabel">주요 행동 유형 (What) <span class="hint">핵심 1~2개</span></span>` + choices('types', lv === 1 ? B.typesMinor : B.types, prev, { multi: true });
          $('#bir-postf', b).hidden = lv === 1;
          $('#bir-lvdesc', b).textContent = (B.levels.find(l => l.v === lv) || {}).desc || '';
        }
      });
    },
    onSave: b => {
      const studentId = val(b, '#bir-stu'), level = +readChoice(b, 'level'), location = readChoice(b, 'loc');
      if (!studentId) { toast('학생을 선택하세요'); return false; }
      if (!level) { toast('행동 강도 단계를 고르세요'); return false; }
      if (!location) { toast('발생 장소를 고르세요'); return false; }
      const rec2 = Object.assign({}, r, { studentId, level, location, date: val(b, '#bir-date') || TODAY(), time: val(b, '#bir-time'), context: readChoice(b, 'ctx'), types: readChoice(b, 'types'), ante: readChoice(b, 'ante'), func: readChoice(b, 'func'), resp: readChoice(b, 'resp'), post: level > 1 ? readChoice(b, 'post') : [], calmIn: val(b, '#bir-in'), calmOut: val(b, '#bir-out'), reporterRole: readChoice(b, 'role'), memo: val(b, '#bir-memo') });
      Store.save('bir', rec2);
      const s = stuById(studentId); const n30 = birIn(addDays(TODAY(), -30), TODAY(), 2).filter(x => x.studentId === studentId).length;
      if (level === 3) toast('3단계 기록 완료 · 보건실 점검·보호자 소통·Tier 3 전담팀 회의를 확인하세요');
      else if (s && +s.tier === 1 && level >= 2 && n30 >= 2) toast(`${s.name}: 30일 BIR ${n30}회 → CICO 선별 후보로 표시됩니다`);
      else toast('기록했습니다. 월례회의 Big 5에 자동 반영됩니다');
      return true;
    }
  });
}
ACTIONS['bir-del'] = t => { const id = t.dataset.v; confirmBox('이 행동사건 기록을 삭제할까요? 되돌릴 수 없습니다.', () => { Store.remove('bir', id); toast('삭제했습니다'); }); };
ACTIONS['bir-edit'] = t => { const r = DB.bir.find(x => x.id === t.dataset.v); if (r) openBir(JSON.parse(JSON.stringify(r))); };

function big5Range() {
  const today = TODAY(), mk = monthKey(today), y = SET().year;
  switch (UI.filters.big5Range) {
    case 'prev': { const [s, e] = monthRange(addMonths(mk, -1)); return [s, e, '지난 달']; }
    case 'sem1': return [`${y}-03-01`, `${y}-07-31`, '1학기'];
    case 'sem2': return [`${y}-08-01`, `${y + 1}-02-28`, '2학기'];
    case 'year': return [`${y}-03-01`, `${y + 1}-02-28`, '올해 전체'];
    default: { const [s, e] = monthRange(mk); return [s, e, '이번 달']; }
  }
}
SEG_HANDLERS.big5Range = v => { UI.filters.big5Range = v; rerender(); };
SEG_HANDLERS.big5Lv = v => { UI.filters.big5Lv = +v; rerender(); };
SEG_HANDLERS.big5Course = v => { UI.filters.big5Course = v; rerender(); };

function problemStatement(b) {
  if (!b.n) return '';
  const top = a => (a[0] || [])[0];
  const course = top(b.course), loc = top(b.loc), ctx = top(b.ctx), type = top(b.type), fn = top(b.func);
  const fg = (PLAN.bir.functions.find(f => f.v === fn) || {}).g;
  const why = !fn ? '기능 미상' : fg === '얻기' ? `${fn} 얻기` : fn;
  return `${course || '전'} 과정 학생들이 ${loc || '—'}에서 ${ctx || '—'} 중에 ${type || '문제행동'} 행동을 보이며, 이는 ${why} 기능으로 추정된다.`;
}

  const [from, to, rl] = big5Range(); const F = UI.filters;
  const flt = F.big5Course ? (b => (stuById(b.studentId) || {}).course === F.big5Course) : null;
  const lvMin = F.big5Lv === 3 ? 3 : F.big5Lv === 1 ? 1 : 2;
  const list = birIn(from, to, lvMin, flt);
  const b = big5(list); const pd = perDay(list, from, to);
  const mk = monthKey(TODAY());
  let prevPd = null;
  if (F.big5Range === 'month' || F.big5Range === 'prev') { const pm = addMonths(monthKey(from), -1); const [ps, pe] = monthRange(pm); prevPd = perDay(birIn(ps, pe, lvMin, flt), ps, pe); }
  const mb = monthlyBir(lvMin, flt);
  const calm = list.filter(x => (x.post || []).includes('심리안정실 이동·안정') || x.calmIn).length;

  return `

    <button class="btn pri" data-act="new-bir">${ico('plus')}행동사건 기록</button></section>
  <div class="row no-print">${seg('big5Range', [{ v: 'month', l: '이번 달' }, { v: 'prev', l: '지난 달' }, { v: 'sem1', l: '1학기' }, { v: 'sem2', l: '2학기' }, { v: 'year', l: '전체' }], F.big5Range)}
    ${seg('big5Lv', [{ v: 2, l: '2·3단계' }, { v: 1, l: '경미 포함' }, { v: 3, l: '3단계만' }], F.big5Lv)}
    ${seg('big5Course', [{ v: '', l: '전 과정' }].concat(PLAN.courses.map(c => ({ v: c, l: c }))), F.big5Course)}</div>

  <section class="grid g4">
    <div class="card kpi acc"><span class="lab">(1) 하루 평균 발생</span><span class="val">${r1(pd)}<small>건/일</small></span>${prevPd != null ? deltaHtml(pd, prevPd, true) : `<span class="delta flat">${rl}</span>`}<span class="xs muted">${rl} 총 ${b.n}건 · 수업일 ${schoolDays(from, to > TODAY() ? TODAY() : to).length}일</span></div>
    <div class="card kpi tier3"><span class="lab">3단계 위기행동</span><span class="val">${list.filter(x => +x.level === 3).length}<small>건</small></span><span class="xs muted">심리안정실 이동 ${calm}건</span></div>
    <div class="card kpi"><span class="lab">관련 학생</span><span class="val">${b.stu.length}<small>명</small></span><span class="xs muted">상위 3명이 ${pct(sum(b.stu.slice(0, 3).map(x => x[1])), b.n)}% 차지</span></div>
    <div class="card kpi"><span class="lab">최다 장소</span><span class="val" style="font-size:20px;line-height:1.3">${esc((b.loc[0] || ['—'])[0])}</span><span class="xs muted">${b.loc[0] ? pct(b.loc[0][1], b.n) + '% 집중' : '기록 없음'}${b.loc[0] && b.loc[0][1] / b.n >= .3 ? ' · 보완교수 대상' : ''}</span></div>
  </section>

  <section class="card"><div class="card-h"><h3>월별 행동사건 추이</h3><span class="sub">목표: CICO 학생 BIR 50%↓, Tier 3 위기행동 70%↓</span></div>
    ${legend([['2단계 주요', 'var(--s4)', 1], ['3단계 위기', 'var(--s8)', 1]].concat(lvMin === 1 ? [['1단계 경미', 'var(--s3)', 1]] : []))}
    ${chart({ type: 'col', h: 220, labels: mb.map(x => fmtM(x.m)), tipLabels: mb.map(x => `${fmtM(x.m)} · 하루 ${r1(x.pd)}건`), series: (lvMin === 1 ? [{ name: '1단계', color: 'var(--s3)', values: mb.map(x => x.n - x.l2 - x.l3) }] : []).concat(lvMin <= 2 ? [{ name: '2단계', color: 'var(--s4)', values: mb.map(x => x.l2) }] : []).concat([{ name: '3단계', color: 'var(--s8)', values: mb.map(x => x.l3) }]) })}
  </section>

  <section class="grid g2">
    <div class="card"><div class="card-h"><h3>(2) 행동 유형 What</h3><span class="sub">${rl}</span></div>${hbars(b.type, { total: b.n })}</div>
    <div class="card"><div class="card-h"><h3>(3) 발생 장소 Where</h3><span class="sub">30% 이상이면 보완교수</span></div>${hbars(b.loc, { total: b.n, showPct: true })}</div>
    <div class="card"><div class="card-h"><h3>(4) 발생 시간 When</h3><span class="sub">시각대별 건수</span></div>
      ${chart({ type: 'col', h: 170, labels: hours.map(h => h + '시'), series: [{ name: '건수', color: 'var(--s1)', values: hours.map(h => b.hour[h] || 0) }] })}
      <div style="margin-top:8px">${hbars(b.ctx, { total: b.n, limit: 4 })}</div></div>
    <div class="card"><div class="card-h"><h3>(5) 다발 학생 Who</h3><span class="sub">Tier 연계 판단</span></div>
      ${b.stu.length ? `<div class="list">${b.stu.slice(0, 7).map(([id, n]) => { const s = stuById(id) || {}; const tr = +s.tier || 1; return `<div class="li"><span class="chip t${tr}"><span class="d"></span>T${tr}</span><div class="grow"><div class="t">${esc(s.name || '(삭제)')}</div><div class="s">${esc(s.cls || '')} · ${n}건</div></div>${tr === 1 && n >= 2 ? `<button class="btn sm" data-act="cico-enroll" data-v="${esc(id)}">CICO 선별</button>` : tr === 2 ? `<button class="btn sm" data-go="cico" data-sub="stu:${esc(id)}">DPR 보기</button>` : tr === 3 ? `<button class="btn sm" data-go="tier3" data-sub="stu:${esc(id)}">BIP</button>` : ''}</div>`; }).join('')}</div>` : '<div class="empty">기록 없음</div>'}</div>
  </section>

  <section class="grid g2">
    <div class="card"><div class="card-h"><h3>장소 × 활동 맥락</h3><span class="sub">진할수록 많이 발생</span></div><div style="overflow-x:auto">${heatmap(PLAN.bir.locations, PLAN.bir.contexts, (r, c) => list.filter(x => x.location === r && x.context === c).length, { colLabel: c => c.replace('·', '·​') })}</div></div>
    <div class="card"><div class="card-h"><h3>추정 기능 · 선행사건</h3><span class="sub">중재 방향 결정</span></div>${hbars(b.func, { total: b.n, limit: 5, color: 'var(--s7)', hiTop: false })}<div style="height:10px"></div>${hbars(b.ante, { total: b.n, limit: 4, color: 'var(--s3)', hiTop: false })}</div>

  <section class="card"><div class="card-h"><h3>최근 기록</h3><span class="sub">눌러서 수정</span></div>${birTable(list.slice().sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || ''))).slice(0, 30))}</section>`;

function birTable(rows) {
  if (!rows.length) return `<div class="empty"><b>이 기간에 기록이 없습니다</b>오른쪽 아래 <b>기록</b> 버튼 → 행동사건(BIR)으로 3분 안에 입력하세요.</div>`;
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>날짜</th><th>학생</th><th>단계</th><th>장소</th><th>유형</th><th>기능</th><th>보고</th></tr></thead><tbody>${rows.map(r => `<tr class="click" data-act="bir-edit" data-v="${esc(r.id)}"><td class="tab">${fmtD(r.date)} ${esc(r.time || '')}</td><td>${esc(stuName(r.studentId))}</td><td><span class="chip t${r.level}">${r.level}단계</span></td><td>${esc(r.location || '')}</td><td>${esc((r.types || []).join(', '))}</td><td>${esc((r.func || []).join(', '))}</td><td class="muted">${esc(r.by || '')}</td></tr>`).join('')}</tbody></table></div>`;
}
function big5Text(mk) {
  const [s, e] = monthRange(mk); const l = birIn(s, e, 2); const b = big5(l);
  const pm = addMonths(mk, -1); const [ps, pe] = monthRange(pm); const pl = birIn(ps, pe, 2);
  const pd = perDay(l, s, e), ppd = perDay(pl, ps, pe);
  const top2 = (a) => a.slice(0, 2).map((x, i) => `${i + 1}위 ${x[0]}(${pct(x[1], b.n)}%)`).join(' / ') || '없음';
  return `[${fmtM(mk)} Big 5 행동데이터 요약]\n(1) 일평균 발생 건수(BIR): 일평균 ${r1(pd)}건 (전월 대비 ${ppd ? Math.round((pd - ppd) / ppd * 100) + '%' : '—'} 증감), 총 ${b.n}건\n(2) 최다 행동 유형(What): ${top2(b.type)}\n(3) 최다 발생 장소(Where): ${top2(b.loc)}\n(4) 최다 발생 시간(When): ${top2(b.ctx)}\n(5) 다발 학생(Who): ${b.stu.slice(0, 3).map(x => `${stuName(x[0])}(${x[1]}건)`).join(', ') || '없음'}\n정밀 문제 진술(초안): ${problemStatement(b)}`;
}
ACTIONS['copy-big5'] = () => copyText(big5Text(monthKey(big5Range()[0])));

/* ================================================================
   Tier 1 보편 예방 · Tier 2 CICO

function classOptions(sel) {
  const cl = classList();
  return `<option value="">학급 선택</option>${cl.map(c => `<option ${c === sel ? 'selected' : ''}>${esc(c)}</option>`).join('')}<option value="__other">직접 입력…</option>`;
}
function readClass(b, sel, other) { const v = val(b, sel); return v === '__other' ? val(b, other) : v; }
function myClass() { const m = ME.get(); const st = m && DB.staff.find(s => s.name === m.name); return st && st.dept && classList().includes(st.dept) ? st.dept : ''; }

function openTally() {
  let p = 0, c = 0, left = 15 * 60, timer = null, running = false;
  const paint = () => {
    $('#t-p').textContent = p; $('#t-c').textContent = c;
    const ratio = c ? r1(p / c) : (p ? p : 0);
    $('#t-r').textContent = c ? `${ratio} : 1` : (p ? `${p} : 0` : '— : —');

  };

    body: `<div class="form"><div class="row between"><div><div class="eyebrow">남은 시간</div><div class="ratio-big num" id="t-time">15:00</div></div><div style="text-align:right"><div class="eyebrow">칭찬 : 교정</div><div class="ratio-big num" id="t-r">— : —</div></div></div>
      <div class="row"><button type="button" class="btn" id="t-start">${ico('clock')}타이머 시작</button><span class="xs muted">교사 자기관찰 또는 동료 상호관찰 (ETLP 3번 지표: 15분 4:1 유지)</span></div>
      <div class="tally"><button type="button" class="pr" id="t-pb"><span class="n num" id="t-p">0</span>구체적 칭찬 +1</button><button type="button" class="co" id="t-cb"><span class="n num" id="t-c">0</span>교정·지적 +1</button></div>
      <div class="row"><button type="button" class="btn sm ghost" id="t-undo">마지막 칭찬 취소</button><button type="button" class="btn sm ghost" id="t-undo2">마지막 교정 취소</button></div>
      <div class="f2"><div class="field"><label for="t-cls">학급·장소</label><select class="inp" id="t-cls">${classOptions(myClass())}</select><input class="inp hidden" id="t-cls2" placeholder="학급·장소"></div><div class="field"><label for="t-who">관찰 대상 교사</label><select class="inp" id="t-who">${staffOptions(ME.name(), null, '본인(자기관찰)')}</select></div></div>
      <div class="field"><label for="t-memo">메모</label><input class="inp" id="t-memo" placeholder="예) 전환 시간 교정이 몰림 → 시각 타이머 사전 예고"></div></div>`,
    onMount: b => {
      paint();
      $('#t-pb', b).onclick = () => { p++; paint(); }; $('#t-cb', b).onclick = () => { c++; paint(); };
      $('#t-undo', b).onclick = () => { p = Math.max(0, p - 1); paint(); }; $('#t-undo2', b).onclick = () => { c = Math.max(0, c - 1); paint(); };
      $('#t-cls', b).addEventListener('change', e => $('#t-cls2', b).classList.toggle('hidden', e.target.value !== '__other'));
      $('#t-start', b).onclick = e => {
        running = !running; e.currentTarget.innerHTML = running ? `${ico('clock')}일시정지` : `${ico('clock')}이어서 시작`;
        clearInterval(timer); if (running) timer = setInterval(() => { if (!$('#t-time')) { clearInterval(timer); return; } left = Math.max(0, left - 1); paint(); if (!left) { clearInterval(timer); running = false; toast('15분 관찰 종료 — 결과를 저장하세요'); } }, 1000);
      };
    },
    onClose: () => clearInterval(timer),
    onSave: b => {

      const minutes = Math.max(1, Math.round((15 * 60 - left) / 60)) || 15;
      Store.save('obs', { date: TODAY(), cls: readClass(b, '#t-cls', '#t-cls2'), target: val(b, '#t-who') || ME.name(), praise: p, correct: c, minutes: left === 15 * 60 ? 15 : minutes, ratio: c ? r1(p / c) : p, memo: val(b, '#t-memo') });
      toast(c && p / c >= 4 ? `4:1 달성 (${r1(p / c)}:1) — 멋집니다!` : '저장했습니다. 다음 관찰에서 칭찬을 한 번 더!'); return true;
    }
  });
}

function readDprScores(box) {

function cicoBirDrop(s) {
  if (!s.cicoStart) return null;
  const before = birIn(addDays(s.cicoStart, -28), addDays(s.cicoStart, -1), 2).filter(b => b.studentId === s.id).length;

function cicoCandidates() {
  const today = TODAY(); const d30 = addDays(today, -30);

  const refs = DB.requests.filter(r => r.type === 'CICO 의뢰' && r.status !== '완료');
  const ids = new Set(Object.keys(cnt).filter(id => cnt[id] >= 2).concat(Object.keys(minor).filter(id => minor[id] >= 5)).concat(refs.map(r => r.studentId)));
  return Array.from(ids).map(id => ({ s: stuById(id), bir: cnt[id] || 0, minor: minor[id] || 0, ref: refs.find(r => r.studentId === id) })).filter(x => x.s && +x.s.tier === 1).sort((a, b) => b.bir - a.bir || b.minor - a.minor);

function meetingSnapshot(mk) {
  const [s, e] = monthRange(mk); const l = birIn(s, e, 2); const b = big5(l);
  const [ps, pe] = monthRange(addMonths(mk, -1)); const pl = birIn(ps, pe, 2);
  const L = cicoStudents(); const sts = L.map(x => cicoStats(x.id));
  const monthAvg = sid => { const v = DB.dpr.filter(d => d.studentId === sid && monthKey(d.date) === mk && d.pct != null).map(d => d.pct); return v.length ? avg(v) : null; };
  const avgs = L.map(x => monthAvg(x.id)).filter(v => v != null);
  const calm = sum(DB.t3log.filter(r => monthKey(r.date) === mk).map(r => r.calm)); const calmP = sum(DB.t3log.filter(r => monthKey(r.date) === addMonths(mk, -1)).map(r => r.calm));
  const top2 = a => a.slice(0, 2).map(x => `${x[0]}(${pct(x[1], b.n)}%)`).join(' / ');
  return { pd: r1(perDay(l, s, e)), ppd: r1(perDay(pl, ps, pe)), n: b.n, type: top2(b.type), loc: top2(b.loc), ctx: top2(b.ctx), hour: sortedEntries(b.hour).slice(0, 2).map(x => `${x[0]}시(${pct(x[1], b.n)}%)`).join(' / '), cicoN: L.length, cicoAvg: avgs.length ? Math.round(avg(avgs)) : null, cicoMet: avgs.filter(v => v >= PLAN.cicoGoal).length, cicoNeed: avgs.filter(v => v < PLAN.cicoGoal).length, calm, calmP, problem: problemStatement(b), topFunc: (b.func[0] || [])[0] || '' };
}

    DB.meeting.push(mk({ date: d, attend: 8 + Math.floor(rnd() * 3), members: 10, facil: '박지호', recorder: m % 2 ? '최유나' : '정우진', timer: m % 2 ? '정우진' : '최유나', predist: true, problem: p[0], funcs: [p[0].includes('회피') ? '과제/지시 회피' : '선호 물건/활동 얻기'], p1: p[1], p2: p[2], p3: p[3], owner: pick(['한지민', '김서연', '이도윤', '박지호']), due: addDays(d, 23), targets: '다발구역 BIR 20% 감소 · CICO DPR 80% 이상 유지 · 심리안정실 이용 주 1회 이하', prevStatus: m === 3 ? null : '완료', prevGoal: m === 3 ? null : pick(['달성', '추가 보완 필요']), planStatus: '완료', kudos: `우수 학급 ${pick(classes)} · 우수 멘토 ${pick(['임수빈', '문채원', '조하율'])}`, notice: '', snap: meetingSnapshot(mkk) }, '최유나'));
  }
  const lastM = DB.meeting[DB.meeting.length - 1]; if (lastM) lastM.planStatus = '진행';
}

boot();
